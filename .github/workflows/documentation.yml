name: Documentation
on:
  pull_request:
    branches:
      - draft
      - main
  push:
    branches:
      - draft
      - main
  merge_group: null
  workflow_dispatch:
    inputs:
      mode:
        description: Incremental diagnosis or complete release validation
        required: true
        type: choice
        default: Incremental
        options:
          - Incremental
          - Release
permissions:
  contents: read
  actions: read
env:
  DOCUMENTATION_COMMIT: ${{ github.sha }}
  INNO_DOCS_ENGINE_ROOT: artifacts/engine-source
  INNO_DOCS_PLAN: artifacts/ci/plan.json
concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reuse:
    name: Plan documentation work
    runs-on: windows-2025
    outputs:
      reused: ${{ steps.verify.outputs.reused }}
      artifact: ${{ steps.verify.outputs.artifact }}
      mode: ${{ steps.plan.outputs.mode }}
      prepare: ${{ steps.plan.outputs.prepare }}
      tools: ${{ steps.plan.outputs.tools }}
      key: ${{ steps.select.outputs.key }}
      covered: ${{ steps.select.outputs.covered }}
      plan-artifact: ${{ steps.upload-plan.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Plan the actual candidate against its merge base
        id: plan
        run: node scripts/ci-plan.mjs bootstrap
      - name: Select trusted identical-input receipt
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs select
      - name: Import selected receipt with authenticated digest
        if: steps.select.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-PublicationArtifact.ps1 -Selection artifacts/reuse/selection.json -Source documentation -Destination artifacts/reuse/import
      - name: Verify receipt and reference the existing site
        id: verify
        if: steps.select.outputs.available == 'true'
        run: node scripts/ci-evidence.mjs verify
      - name: Retain current editorial observations
        if: steps.verify.outputs.reused == 'true' || steps.select.outputs.covered == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-editorial-attempt-${{ github.run_attempt }}
          path: artifacts/api-editorial.json
          if-no-files-found: error
          retention-days: 30
      - name: Install operational Markdown checker for reused publication
        if: steps.verify.outputs.reused == 'true' || steps.select.outputs.covered == 'true'
        run: npm ci
      - name: Check current guidance independently of reused website inputs
        if: steps.verify.outputs.reused == 'true' || steps.select.outputs.covered == 'true'
        run: node scripts/check-guidance.mjs
      - name: Retain the execution plan
        id: upload-plan
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-plan-attempt-${{ github.run_attempt }}
          path: artifacts/ci/plan.json
          retention-days: 30
          if-no-files-found: error
  projection:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && needs.reuse.outputs.covered != 'true'
    name: Documentation projection
    outputs:
      artifact: ${{ steps.site.outputs.artifact_id }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.reuse.outputs.plan-artifact }}
          merge-multiple: true
          path: artifacts/ci
      - name: Read immutable tooling binding
        id: binding
        shell: pwsh
        run: |
          $binding = Get-Content reference/engine.lock.json -Raw | ConvertFrom-Json
          if ($binding.repository -ne 'https://github.com/Wolfiora/InnoEngine' -or $binding.toolingRevision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid engine binding.' }
          "revision=$($binding.toolingRevision)" >> $env:GITHUB_OUTPUT
          if ($binding.revision -cnotmatch '^[a-f0-9]{40}$') { throw 'Invalid API source revision.' }
          "api-revision=$($binding.revision)" >> $env:GITHUB_OUTPUT
        if: needs.reuse.outputs.prepare == 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ steps.binding.outputs.revision }}
          path: artifacts/engine-source
          persist-credentials: false
        if: needs.reuse.outputs.prepare == 'true'
      - uses: ./artifacts/engine-source/.github/actions/setup-dotnet
        with:
          global-json-file: artifacts/engine-source/global.json
        if: needs.reuse.outputs.prepare == 'true'
      - run: npm ci
      - name: Check operational guidance without product rendering
        run: node scripts/check-guidance.mjs
      - run: npm test
        if: needs.reuse.outputs.tools == 'true' || needs.reuse.outputs.mode == 'Release'
      - name: Verify bounded artifact import
        shell: pwsh
        run: ./tests/PublicationArchive.Tests.ps1
        if: needs.reuse.outputs.tools == 'true' || needs.reuse.outputs.mode == 'Release'
      - name: Restore immutable managed bundles
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/tooling-bootstrap/bundles
          key: docs-bundles-windows-${{ github.run_id }}
          restore-keys: docs-bundles-windows-
      - name: Restore immutable parsed page payloads only
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            artifacts/documentation-query/current.json
            artifacts/documentation-query/generations/*/manifest.json
            artifacts/documentation-query/pages/*/page.json
          key: docs-parsed-windows-${{ github.run_id }}
          restore-keys: docs-parsed-windows-
      - name: Prepare canonical API content and editorial observations
        shell: pwsh
        run: npm run docs:prepare
        if: needs.reuse.outputs.prepare == 'true'
      - name: Retain immutable parsed page payloads
        if: success() && needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            artifacts/documentation-query/current.json
            artifacts/documentation-query/generations/*/manifest.json
            artifacts/documentation-query/pages/*/page.json
          key: docs-parsed-windows-${{ github.run_id }}
      - name: Select completed independent page checks
        id: previous-checks
        if: needs.reuse.outputs.prepare == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs checks-select
      - name: Import authenticated page receipts
        if: steps.previous-checks.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-PublicationArtifact.ps1 -Selection artifacts/checks/selection.json -Source documentation -Destination artifacts/checks/import
      - name: Verify selected page receipt structure
        if: steps.previous-checks.outputs.available == 'true'
        run: node scripts/ci-evidence.mjs checks-verify
      - name: Select canonical relationships and page checks
        id: scope
        if: needs.reuse.outputs.prepare == 'true'
        run: node scripts/ci-plan.mjs select
      - name: Retain immutable managed bundles
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/tooling-bootstrap/bundles
          key: docs-bundles-windows-${{ github.run_id }}
      - name: Retain complete editorial observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-editorial-attempt-${{ github.run_attempt }}
          path: artifacts/api-editorial.json
          if-no-files-found: warn
          retention-days: 30
      - name: Restore disposable Markdown rendering cache
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .astro
          key: docs-render-windows-${{ github.run_id }}
          restore-keys: docs-render-windows-
      - run: npm run check
        if: needs.reuse.outputs.tools == 'true' || needs.reuse.outputs.mode == 'Release'
      - name: Select authenticated reusable example evidence
        id: previous-examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/example-work.mjs select
        if: needs.reuse.outputs.prepare == 'true'
      - name: Import the exact trusted receipt artifact
        if: needs.reuse.outputs.prepare == 'true' && (steps.previous-examples.outputs.available == 'true')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-PublicationArtifact.ps1 -Selection artifacts/examples/selection.json -Source documentation -Destination artifacts/previous-examples
      - name: Select only changed or uncovered executable examples
        id: example-work
        shell: pwsh
        env:
          PREVIOUS_AVAILABLE: ${{ steps.previous-examples.outputs.available }}
        run: |
          $previous = @(if ($env:PREVIOUS_AVAILABLE -eq 'true') { 'artifacts/previous-examples' })
          node scripts/example-work.mjs plan @previous
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: needs.reuse.outputs.prepare == 'true'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.example-work.outputs.compile == 'true'
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ steps.binding.outputs.api-revision }}
          path: artifacts/example-engine-source
          submodules: recursive
          persist-credentials: false
      - uses: ./artifacts/example-engine-source/.github/actions/setup-dotnet
        if: needs.reuse.outputs.prepare == 'true' && (steps.example-work.outputs.compile == 'true')
        with:
          global-json-file: artifacts/example-engine-source/global.json
      - name: Compile selected examples against real managed inputs
        if: needs.reuse.outputs.prepare == 'true' && (steps.example-work.outputs.compile == 'true')
        shell: pwsh
        run: ./scripts/prepare-examples.ps1 -EngineRoot artifacts/example-engine-source -ToolingRoot artifacts/engine-source
      - name: Reconcile reused and newly executed example groups
        shell: pwsh
        env:
          COMPILED_EXAMPLES: ${{ steps.example-work.outputs.compile }}
        run: |
          $compiled = @(if ($env:COMPILED_EXAMPLES -eq 'true') { 'artifacts/examples/compiled.json' })
          node scripts/example-work.mjs complete @compiled
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        if: needs.reuse.outputs.prepare == 'true'
      - name: Retain exact example receipts for trusted reuse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-examples-attempt-${{ github.run_attempt }}
          path: |
            artifacts/examples/manifest.json
            artifacts/examples/reports/
          if-no-files-found: error
          retention-days: 90
        if: needs.reuse.outputs.prepare == 'true'
      - run: npm run build
        env:
          INNO_DOCS_EXAMPLE_MANIFEST: artifacts/examples/manifest.json
        if: steps.scope.outputs.render == 'true'
      - name: Install locked browser runtime
        run: npx --no-install playwright install chromium
        if: steps.scope.outputs.browser != 'None' && needs.reuse.outputs.prepare == 'true'
      - name: Verify responsive reading, search and keyboard journeys
        run: node scripts/run-browser-work.mjs
        if: steps.scope.outputs.browser != 'None' && needs.reuse.outputs.prepare == 'true'
      - name: Reconcile every selected check result
        run: node scripts/ci-plan.mjs complete
      - name: Record independent page receipts
        if: needs.reuse.outputs.prepare == 'true'
        run: node scripts/ci-evidence.mjs checks-create
      - name: Retain independent page receipts
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-checks-attempt-${{ github.run_attempt }}
          path: artifacts/checks/receipt/
          if-no-files-found: error
          retention-days: 90
      - name: Retain successful Markdown rendering cache
        if: needs.reuse.outputs.prepare == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .astro
          key: docs-render-windows-${{ github.run_id }}
      - name: Retain partial preview with included page list
        if: needs.reuse.outputs.mode == 'Incremental' && steps.scope.outputs.render == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-partial-preview-attempt-${{ github.run_attempt }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Freeze the exact checked site
        run: node scripts/publication-artifact.mjs create dist artifacts/canonical-catalog.json artifacts/completion.json
        if: needs.reuse.outputs.mode == 'Release'
      - name: Enforce the Pages publication size limit
        run: node scripts/pages-deployment.mjs size dist
        if: needs.reuse.outputs.mode == 'Release'
      - name: Retain one Pages artifact for preview and delivery
        id: site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: documentation-site-attempt-${{ github.run_attempt }}
          path: dist/
          include-hidden-files: true
          retention-days: 90
        if: needs.reuse.outputs.mode == 'Release'
      - name: Record reusable successful inputs
        run: node scripts/ci-evidence.mjs create
        if: needs.reuse.outputs.mode == 'Release'
      - name: Retain small validation receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-receipt-${{ needs.reuse.outputs.key }}-attempt-${{ github.run_attempt }}
          path: artifacts/validation-receipt/
          if-no-files-found: error
          retention-days: 90
        if: needs.reuse.outputs.mode == 'Release'
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: documentation-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            artifacts/completion.json
            artifacts/site-build.json
            artifacts/api-editorial.json
            artifacts/browser/
            artifacts/examples/*.log
            artifacts/examples/work.json
            artifacts/examples/compiled.json
            artifacts/examples/result.json

            artifacts/ci/
          if-no-files-found: warn
          retention-days: 30
  validation:
    name: Documentation validation
    if: always()
    needs:
      - reuse
      - projection
      - tooling-portability
    runs-on: windows-2025
    steps:
      - name: Reconcile required documentation work
        shell: pwsh
        env:
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          PROJECTION_RESULT: ${{ needs.projection.result }}
          PORTABILITY_RESULT: ${{ needs.tooling-portability.result }}
          MODE: ${{ needs.reuse.outputs.mode }}
          TOOLS: ${{ needs.reuse.outputs.tools }}
          COVERED: ${{ needs.reuse.outputs.covered }}
        run: |
          if ($env:REUSE_RESULT -ne 'success') { throw 'Input/evidence selection failed.' }
          if ($env:COVERED -eq 'true') {
            if ($env:PROJECTION_RESULT -ne 'skipped' -or $env:PORTABILITY_RESULT -ne 'skipped') { throw 'Unexpected release coverage state.' }
            'Reused: the actual release PR validation passed and covers this draft input.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($env:REUSED -eq 'true') {
            if ($env:PROJECTION_RESULT -ne 'skipped' -or $env:PORTABILITY_RESULT -ne 'skipped') { throw 'Unexpected reused execution state.' }
            'Reused: complete release candidate with matching authenticated inputs.' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          if ($env:PROJECTION_RESULT -ne 'success') { throw "Required documentation work is $env:PROJECTION_RESULT; missing, canceled and skipped work cannot pass." }
          $portable = $env:MODE -eq 'Release' -or $env:TOOLS -eq 'true'
          if ($portable -and $env:PORTABILITY_RESULT -ne 'success') { throw "Required portable tooling work is $env:PORTABILITY_RESULT." }
          if (!$portable -and $env:PORTABILITY_RESULT -ne 'skipped') { throw 'Unexpected portability selection state.' }
          "Passed: $($env:MODE) documentation plan. Incremental previews are not publication certification." >> $env:GITHUB_STEP_SUMMARY
  tooling-portability:
    name: Linux documentation preparation
    runs-on: ubuntu-24.04
    env:
      INNO_DOCS_ENGINE_ROOT: ""
      INNO_DOCS_PLAN: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - name: Restore Linux immutable managed bundles
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/tooling-bootstrap/bundles
          key: docs-bundles-linux-${{ github.run_id }}
          restore-keys: docs-bundles-linux-
      - name: Restore immutable parsed page payloads only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            artifacts/documentation-query/current.json
            artifacts/documentation-query/generations/*/manifest.json
            artifacts/documentation-query/pages/*/page.json
          key: docs-parsed-linux-${{ github.run_id }}
          restore-keys: docs-parsed-linux-
      - name: Prepare dependency-keyed tooling bundle
        run: node scripts/prepare-catalog.mjs --bundle-only
      - name: Select independently completed portability evidence
        id: portable
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-evidence.mjs portability-select
      - name: Import authenticated portability receipt
        if: steps.portable.outputs.available == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Get-PublicationArtifact.ps1 -Selection artifacts/portability/selection.json -Source documentation -Destination artifacts/portability/import
      - name: Verify portability input identity
        id: reuse
        if: steps.portable.outputs.available == 'true'
        run: node scripts/ci-evidence.mjs portability-verify
      - run: node --test tests/site-build.test.mjs
        if: steps.reuse.outputs.reused != 'true'
      - name: Prepare the pinned managed catalog without PowerShell or Native
        run: npm run docs:prepare
        if: steps.reuse.outputs.reused != 'true'
      - name: Verify the Linux catalog and bound reference set
        run: node scripts/check-projection.mjs artifacts/canonical-catalog.json > artifacts/linux-catalog.json
        if: steps.reuse.outputs.reused != 'true'
      - name: Retain portability diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: linux-documentation-attempt-${{ github.run_attempt }}
          path: artifacts/linux-catalog.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record successful portable tool inputs
        if: steps.reuse.outputs.reused != 'true'
        run: node scripts/ci-evidence.mjs portability-create
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: steps.reuse.outputs.reused != 'true'
        with:
          name: documentation-portability-${{ steps.portable.outputs.key }}-attempt-${{ github.run_attempt }}
          path: artifacts/portability/receipt/
          retention-days: 90
          if-no-files-found: error
      - name: Retain Linux immutable bundles
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: artifacts/tooling-bootstrap/bundles
          key: docs-bundles-linux-${{ github.run_id }}
      - name: Retain immutable parsed page payloads
        if: success() && steps.reuse.outputs.reused != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            artifacts/documentation-query/current.json
            artifacts/documentation-query/generations/*/manifest.json
            artifacts/documentation-query/pages/*/page.json
          key: docs-parsed-linux-${{ github.run_id }}
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && (needs.reuse.outputs.tools == 'true' || needs.reuse.outputs.mode == 'Release') && needs.reuse.outputs.covered != 'true'
  deploy:
    name: Deploy GitHub Pages
    if: always() && needs.validation.result == 'success' && github.repository == 'Wolfiora/InnoEngine.Docs' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.reuse.outputs.mode == 'Release'
    needs:
      - validation
      - reuse
      - projection
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.21.0
      - name: Deploy the exact checked artifact without rebuilding or re-uploading
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_ARTIFACT_ID: ${{ needs.reuse.outputs.artifact || needs.projection.outputs.artifact }}
        run: node scripts/pages-deployment.mjs deploy
