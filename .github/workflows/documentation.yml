name: Documentation

on:
  pull_request:
    branches: [draft, main]
  push:
    branches: [draft, main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DOCUMENTATION_COMMIT: ${{ github.sha }}

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  projection:
    name: Documentation projection
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read immutable tooling binding
        id: binding
        shell: pwsh
        run: |
          $binding = Get-Content reference/engine.lock.json -Raw | ConvertFrom-Json
          if ($binding.repository -ne 'https://github.com/Wolfiora/InnoEngine' -or $binding.toolingRevision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid engine binding.' }
          "revision=$($binding.toolingRevision)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ steps.binding.outputs.revision }}
          path: artifacts/engine-source
          persist-credentials: false
      - uses: ./artifacts/engine-source/.github/actions/setup-dotnet
        with:
          global-json-file: artifacts/engine-source/global.json
      - name: Verify shared rules and provenance
        shell: pwsh
        run: ./scripts/check-rule-authority.ps1 -EngineRoot artifacts/engine-source
      - run: npm ci
      - run: npm test
      - name: Verify bounded artifact import
        shell: pwsh
        run: ./tests/PublicationArchive.Tests.ps1
      - name: Prepare canonical API content and editorial observations
        shell: pwsh
        run: ./scripts/prepare-catalog.ps1 -EngineRoot artifacts/engine-source
      - name: Retain complete editorial observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-editorial-attempt-${{ github.run_attempt }}
          path: artifacts/api-editorial.json
          if-no-files-found: warn
          retention-days: 30
      - run: npm run check
      - run: npm run build
      - name: Validate complete site and selected example receipts
        shell: pwsh
        run: |
          $examples = if (Test-Path -LiteralPath reference/examples/manifest.json) { @('--example-manifest', 'reference/examples/manifest.json') } else { @() }
          node scripts/check-projection.mjs artifacts/canonical-catalog.json dist --complete @examples > artifacts/completion.json
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/completion.json; exit $LASTEXITCODE }
      - name: Retain the static preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview-attempt-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Install locked browser runtime
        run: npx --no-install playwright install chromium
      - name: Verify responsive reading, search and keyboard journeys
        run: npm run test:browser
      - name: Freeze the exact checked site
        run: node scripts/publication-artifact.mjs create dist artifacts/canonical-catalog.json artifacts/completion.json
      - name: Retain verified delivery output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site-attempt-${{ github.run_attempt }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Retain diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-diagnostics-attempt-${{ github.run_attempt }}
          path: |
            artifacts/completion.json
            artifacts/api-editorial.json
            artifacts/browser/
          if-no-files-found: warn
          retention-days: 30

  validation:
    name: Documentation validation
    if: always()
    needs: [projection]
    runs-on: windows-2025
    steps:
      - name: Reconcile required documentation work
        shell: pwsh
        env:
          PROJECTION_RESULT: ${{ needs.projection.result }}
        run: |
          if ($env:PROJECTION_RESULT -ne 'success') { throw "Required documentation work is $env:PROJECTION_RESULT; missing, canceled and skipped work cannot pass." }
          'Documentation facts, content, examples and website checks passed. API editorial coverage is advisory.' >> $env:GITHUB_STEP_SUMMARY
