name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      engine_run:
        description: Successful engine run providing matching source API certification
        type: string
        required: true
      bootstrap:
        description: Use the explicitly approved ai-pipeline source before default-branch cutover
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  projection:
    name: Documentation projection
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Read immutable engine binding
        id: binding
        shell: pwsh
        run: |
          $binding = Get-Content reference/engine.lock.json -Raw | ConvertFrom-Json
          if ($binding.repository -ne 'https://github.com/Wolfiora/InnoEngine' -or $binding.toolingRevision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid engine binding.' }
          "revision=$($binding.toolingRevision)" >> $env:GITHUB_OUTPUT
      - name: Check out the pinned tooling source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Wolfiora/InnoEngine
          ref: ${{ steps.binding.outputs.revision }}
          path: artifacts/engine-source
          persist-credentials: false
      - name: Install and verify the exact pinned tooling SDK
        uses: ./artifacts/engine-source/.github/actions/setup-dotnet
        with:
          global-json-file: artifacts/engine-source/global.json
      - run: npm ci
      - run: npm test
      - name: Verify bounded artifact import and rejection
        shell: pwsh
        run: ./tests/PublicationArchive.Tests.ps1
      - name: Require the restricted evidence installation
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          APP_ID: ${{ vars.INNO_DOCS_APP_ID }}
          APP_KEY: ${{ secrets.INNO_DOCS_APP_PRIVATE_KEY }}
        run: |
          if (-not $env:APP_ID -or -not $env:APP_KEY) { throw 'The restricted GitHub App installation is not provisioned. Source certification cannot be imported.' }
      - name: Obtain read-only cross-repository evidence access
        if: github.event_name == 'workflow_dispatch'
        id: evidence-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.INNO_DOCS_APP_ID }}
          private-key: ${{ secrets.INNO_DOCS_APP_PRIVATE_KEY }}
          owner: Wolfiora
          repositories: InnoEngine
          permission-actions: read
          permission-contents: read
      - name: Import the authenticated source certificate
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.evidence-token.outputs.token }}
          ENGINE_RUN: ${{ inputs.engine_run }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          node scripts/publication-source.mjs source reference/engine.lock.json artifacts/source-selection.json
          if ($LASTEXITCODE -ne 0) { throw 'Source certificate selection failed.' }
          ./scripts/Get-PublicationArtifact.ps1 -Selection artifacts/source-selection.json -Source engine -Destination artifacts/source-evidence
          # The entire archive digest was authenticated and verified before this file identity is accepted.
          $file = Join-Path $PWD 'artifacts/source-evidence/source-certificate.json'
          "INNO_SOURCE_EVIDENCE=$file" >> $env:GITHUB_ENV
          "INNO_SOURCE_EVIDENCE_SHA256=$((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Prepare canonical catalog using managed tooling only
        shell: pwsh
        run: ./scripts/prepare-catalog.ps1 -EngineRoot artifacts/engine-source -SourceEvidencePath $env:INNO_SOURCE_EVIDENCE -SourceEvidenceIdentity $env:INNO_SOURCE_EVIDENCE_SHA256
      - run: npm run check
      - run: npm run build
      - name: Verify the exact rendered projection
        shell: pwsh
        run: |
          node scripts/check-projection.mjs artifacts/canonical-catalog.json dist > artifacts/projection.json
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/projection.json; exit $LASTEXITCODE }
      - name: Upload the inspected static preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Install the locked browser runtime
        run: npx --no-install playwright install chromium
      - name: Verify responsive reading, search and keyboard journeys
        run: npm run test:browser
      - name: Require complete content and source evidence
        shell: pwsh
        run: |
          node scripts/check-projection.mjs artifacts/canonical-catalog.json dist --complete > artifacts/completion.json
          if ($LASTEXITCODE -ne 0) { Get-Content artifacts/completion.json; exit $LASTEXITCODE }
      - name: Freeze the verified site and exact provenance
        run: node scripts/publication-artifact.mjs create dist artifacts/canonical-catalog.json artifacts/completion.json
      - name: Retain the verified site for artifact-only promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-site-attempt-${{ github.run_attempt }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Preserve first-failure and catalog diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-diagnostics
          path: |
            artifacts/canonical-catalog.json
            artifacts/projection.json
            artifacts/completion.json
            artifacts/source-selection.json
            artifacts/source-evidence/source-certificate.json
            artifacts/browser/
          if-no-files-found: warn
          retention-days: 30

  validation:
    name: Documentation validation
    if: always()
    needs: [projection]
    runs-on: windows-2025
    steps:
      - name: Reconcile required results
        shell: pwsh
        env:
          PROJECTION_RESULT: ${{ needs.projection.result }}
        run: |
          if ($env:PROJECTION_RESULT -ne 'success') { throw "Required documentation projection is $env:PROJECTION_RESULT; missing, canceled, skipped and failed work cannot certify documentation." }
          'Documentation content, canonical projection and required source evidence passed.' >> $env:GITHUB_STEP_SUMMARY
