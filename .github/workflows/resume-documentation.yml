name: Resume certified documentation

on:
  workflow_run:
    workflows: [Receive engine source evidence]
    types: [completed]
  workflow_dispatch:
    inputs:
      import_run:
        description: Completed source-evidence import whose certificate became available
        type: string
        required: true

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: documentation-source-resume-${{ github.event.workflow_run.id || inputs.import_run }}
  cancel-in-progress: false

jobs:
  resume:
    name: Resume matching source validation
    if: github.repository == 'Wolfiora/InnoEngine.Docs' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/docs-modernization')))
    runs-on: windows-2025
    steps:
      # Only the protected workflow revision is executed. Candidate bindings are read as bounded JSON through GitHub.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - name: Resume only the unchanged candidate's failed evidence selection
        env:
          GH_TOKEN: ${{ github.token }}
          IMPORT_RUN: ${{ github.event.workflow_run.id || inputs.import_run }}
        run: node scripts/resume-source-validation.mjs
